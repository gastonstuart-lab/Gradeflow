name: Review combined GradeFlow login boxes before preview publish

on:
  push:
    branches:
      - preview/login-boxes-pr98-on-reviewed-v2-20261111

permissions:
  contents: read

concurrency:
  group: login-boxes-combined-verify
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Run complete Flutter tests
        run: flutter test
      - name: Compile release preview
        run: flutter build web --release --no-wasm-dry-run --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW=true --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW_CHANNEL=login-boxes

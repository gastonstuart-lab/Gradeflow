name: Review GradeFlow V2 + personalised Home and timetable on Firebase PREVIEW only
run-name: Preview personalised GradeFlow Home / ${{ github.actor }}
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/preview-gradebook-pr96.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: gradeflow-pr96-hosting-preview
  cancel-in-progress: false

jobs:
  reviewed-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Reuse existing OIDC subject authorized for the production approval environment.
    # This job's only publishing API endpoint is /channels/classroom-v2/releases,
    # never the live-channel release endpoint.
    environment: production
    timeout-minutes: 55
    steps:
      - name: Checkout exact reviewed PR97 combined candidate (not main UI)
        uses: actions/checkout@v4
        with:
          ref: 21c1bce9d65e2913a016daaa9dfab1b2f905dd3c
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Assert pinned candidate, read-only repository, preview-only manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "21c1bce9d65e2913a016daaa9dfab1b2f905dd3c"
          grep -q 'PreviewReadOnlyFirestoreRepository(userId: userId)' lib/repositories/repository_factory.dart
          node - <<'NODE'
          const c=require('./firebase.preview.json');
          if (!c.hosting || c.hosting.public !== 'build/web' ||
              !c.hosting.rewrites?.some(r=>r.source==='**'&&r.destination==='/index.html') ||
              ['firestore','functions','storage','database','remoteconfig','extensions'].some(k=>!!c[k])) {
            throw Error('Preview manifest must deploy Hosting files only');
          }
          NODE
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build authenticated READ-ONLY preview (not live V2 release)
        shell: bash
        run: |
          flutter build web --release --no-wasm-dry-run --target lib/main.dart \
            --base-href / \
            --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW=true
          test -s build/web/main.dart.js
      - name: Confirm existing-project GitHub keyless auth configuration
        env:
          WIF_PROVIDER: ${{ vars.GRADEFLOW_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GRADEFLOW_WIF_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]
          [[ "$WIF_SERVICE_ACCOUNT" =~ ^[^@]+@gradeflow-20260113\.iam\.gserviceaccount\.com$ ]]
      - name: Authenticate via protected main-branch GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GRADEFLOW_WIF_PROVIDER }}
          service_account: ${{ vars.GRADEFLOW_WIF_SERVICE_ACCOUNT }}
          project_id: gradeflow-20260113
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud for short-lived Workload Identity tokens
        uses: google-github-actions/setup-gcloud@v3
      - name: Checkout independently reviewed Hosting-only REST publisher
        uses: actions/checkout@v4
        with:
          ref: main
          path: preview-tools
          persist-credentials: false
      - name: Publish ONLY temporary classroom-v2 channel via Firebase Hosting REST
        shell: bash
        run: |
          set -euo pipefail
          node preview-tools/scripts/publish-preview-hosting-rest.mjs

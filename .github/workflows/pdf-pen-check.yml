name: PDF pen regression checks
on:
  push:
    branches: [fix/pdf-independent-ink-pen-eraser-20261116]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: teacher-tools-preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pdf-pen-browser-evidence
          path: |
            teacher-tools-preview/test-results/
            teacher-tools-preview/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

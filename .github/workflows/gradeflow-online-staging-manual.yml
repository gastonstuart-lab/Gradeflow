name: GradeFlow isolated online staging — manual only

on:
  workflow_dispatch:
    inputs:
      staging_project_id:
        description: Dedicated Firebase staging project ID (never gradeflow-20260113)
        required: true
        type: string
      publish:
        description: Deploy to this separate staging project after checks (default false)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gradeflow-isolated-online-staging
  cancel-in-progress: false

jobs:
  build-and-optional-deploy:
    if: github.ref == 'refs/heads/integration/v2-flutterfire-auth-refresh-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: gradeflow-staging
    env:
      GRADEFLOW_PLANNER_V2_STAGING: 'true'
      GRADEFLOW_V2_LOCAL_EMULATORS: 'false'
      GRADEFLOW_STAGING_FIREBASE_PROJECT_ID: ${{ inputs.staging_project_id }}
      GRADEFLOW_STAGING_FIREBASE_API_KEY: ${{ secrets.GRADEFLOW_STAGING_FIREBASE_API_KEY }}
      GRADEFLOW_STAGING_FIREBASE_APP_ID: ${{ secrets.GRADEFLOW_STAGING_FIREBASE_APP_ID }}
      GRADEFLOW_STAGING_FIREBASE_SENDER_ID: ${{ secrets.GRADEFLOW_STAGING_FIREBASE_SENDER_ID }}
      GRADEFLOW_STAGING_FIREBASE_AUTH_DOMAIN: ${{ secrets.GRADEFLOW_STAGING_FIREBASE_AUTH_DOMAIN }}
      GRADEFLOW_STAGING_FIREBASE_STORAGE_BUCKET: ${{ secrets.GRADEFLOW_STAGING_FIREBASE_STORAGE_BUCKET }}
      GRADEFLOW_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.GRADEFLOW_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
      GRADEFLOW_REQUIRE_SERVICE_ACCOUNT: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Verify staging project ownership and block production
        run: node staging-tests/online-project-guard.mjs

      - name: Validate staging guard tests
        run: node --test staging-tests/online-project-guard.test.mjs

      - name: Lock reviewed Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check all Flutter code
        run: flutter analyze

      - name: Run all Flutter regression tests
        run: flutter test

      - name: Install Firebase test tools
        run: npm install --prefix staging-tests --no-audit --no-fund

      - name: Validate restrictive Firestore staging rules
        run: |
          ./staging-tests/node_modules/.bin/firebase emulators:exec \
            --project demo-gradeflow-v2-staging \
            --config firebase.staging.json --only firestore \
            "node staging-tests/rules.test.mjs"

      - name: Compile authenticated web app against ONLY the dedicated staging project
        run: |
          flutter build web --release --no-wasm-dry-run --target lib/main.dart \
            --base-href / \
            --dart-define=GRADEFLOW_PLANNER_V2_STAGING=true \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_PROJECT_ID="$GRADEFLOW_STAGING_FIREBASE_PROJECT_ID" \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_API_KEY="$GRADEFLOW_STAGING_FIREBASE_API_KEY" \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_APP_ID="$GRADEFLOW_STAGING_FIREBASE_APP_ID" \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_SENDER_ID="$GRADEFLOW_STAGING_FIREBASE_SENDER_ID" \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_AUTH_DOMAIN="$GRADEFLOW_STAGING_FIREBASE_AUTH_DOMAIN" \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_STORAGE_BUCKET="$GRADEFLOW_STAGING_FIREBASE_STORAGE_BUCKET"

      - name: Retain reviewable staging build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradeflow-isolated-staging-web
          path: build/web/
          retention-days: 7

      - name: Deploy ONLY staging Hosting and staging rules after manual publish approval
        if: inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/gradeflow-staging-deploy-account.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$GRADEFLOW_STAGING_FIREBASE_SERVICE_ACCOUNT_JSON" > "$credential_file"
          chmod 600 "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          ./staging-tests/node_modules/.bin/firebase deploy \
            --project "$GRADEFLOW_STAGING_FIREBASE_PROJECT_ID" \
            --config firebase.staging.deploy.json \
            --only hosting,firestore:rules \
            --non-interactive

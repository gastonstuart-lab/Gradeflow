name: InstructOS GitHub Pages Preview

on:
  push:
    branches:
      - integration/instructos-unification
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'review-hub/**'
      - 'pubspec.yaml'
      - '.github/workflows/instructos-pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: instructos-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Shell hierarchy regression test
        run: flutter test test/os_app_registry_test.dart

      - name: Build GitHub Pages preview
        run: flutter build web --release --base-href "/Gradeflow/"

      - name: Add reviewer hub
        run: |
          mkdir -p build/web/review
          cp -R review-hub/. build/web/review/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

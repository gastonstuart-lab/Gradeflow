name: Planner V2 staging Firestore isolation
on:
  push:
    branches:
      - release/planner-v2-staging-rules-tests-20261109
  pull_request:
    branches:
      - release/classroom-v2-staging-firebase-config-20261109
permissions:
  contents: read
jobs:
  firestore-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --prefix staging-tests --no-audit --no-fund
      - name: Run Firebase emulators against demo-only staging project
        run: ./staging-tests/node_modules/.bin/firebase emulators:exec --project demo-gradeflow-v2-staging --config firebase.staging.json --only firestore "node staging-tests/rules.test.mjs"
  flutter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-wasm-dry-run --target lib/main_classroom_preview.dart --base-href /

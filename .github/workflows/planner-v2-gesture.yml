name: Planner V2 gesture integration checks
on:
  push:
    branches:
      - engineering/planner-v2-gesture-wiring-20261109
  pull_request:
    branches:
      - engineering/planner-v2-geometry-20261109
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/components/seating/planner_v2_geometry.dart test/planner_v2_geometry_test.dart
      - run: flutter analyze
      - run: flutter test test/planner_v2_geometry_test.dart test/seating_service_test.dart
      - run: flutter test
      - run: flutter build web --release --no-wasm-dry-run --target lib/main_classroom_preview.dart --base-href /

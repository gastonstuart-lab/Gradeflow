name: Planner V2 Auth and Firestore emulator E2E
on:
  push:
    branches:
      - integration/v2-auth-firestore-emulator-e2e-20261109
  pull_request:
    branches:
      - integration/approved-v2-auth-staging-candidate-20261109
permissions:
  contents: read
jobs:
  authenticated-emulator-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix staging-tests --no-audit --no-fund
      - name: Exercise real Firebase SDKs against isolated Auth and Firestore emulators
        run: |
          ./staging-tests/node_modules/.bin/firebase emulators:exec \
            --project demo-gradeflow-v2-staging \
            --config firebase.staging.json \
            --only firestore,auth \
            "node staging-tests/rules.test.mjs && node staging-tests/auth-persistence.test.mjs"
  flutter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-wasm-dry-run --target lib/main_classroom_preview.dart --base-href /

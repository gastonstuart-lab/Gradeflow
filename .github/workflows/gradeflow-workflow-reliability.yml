name: GradeFlow workflow reliability candidate
on:
  push:
    branches: [audit/gradeflow-workflow-reliability-20261116]
    paths: ['lib/**', 'test/**', 'web/**', 'assets/**', 'teacher-tools-preview/**', 'pubspec.*', '.github/workflows/gradeflow-workflow-reliability.yml']
permissions:
  contents: read
concurrency:
  group: gradeflow-workflow-reliability
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Preview authentication checks
        run: flutter test --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW=true test/auth_fallback_safety_test.dart test/login_screen_test.dart
      - name: Live V2 authentication checks
        run: flutter test --dart-define=GRADEFLOW_LIVE_CLASSROOM_V2=true test/auth_fallback_safety_test.dart test/login_screen_test.dart test/gradeflow_existing_project_preview_test.dart
      - run: flutter build web --release --no-wasm-dry-run --target lib/main.dart --base-href / --dart-define=GRADEFLOW_LIVE_CLASSROOM_V2=true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve Teaching Studio in the complete application candidate
        working-directory: teacher-tools-preview
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
          npm test
          mkdir -p ../build/web/teaching-studio
          cp -a dist/. ../build/web/teaching-studio/
      - uses: actions/upload-artifact@v4
        with:
          name: gradeflow-reliability-app
          path: build/web/
          retention-days: 14

name: Native Gradebook review gate
on:
  push:
    branches: [qa/native-gradebook-20261117, release/gradebook-reliability-20261117]
  pull_request:
    branches: [integration/gradeflow-v2-release-candidate-20261115]
    paths: ['lib/**', 'test/**', 'e2e/native_gradebook_acceptance.spec.ts', 'staging-tests/**', 'firebase.native-gradebook-test.json', 'playwright.native-gradebook.config.ts', 'pubspec.*', 'teacher-tools-preview/**', '.github/workflows/native-gradebook-review.yml']
permissions:
  contents: read
concurrency:
  group: native-gradebook-review-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  application:
    name: Full tests and complete review package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build actual application without deploying
        run: flutter build web --release --no-wasm-dry-run --dart-define=GRADEFLOW_LIVE_CLASSROOM_V2=true
      - name: Build and test unchanged Studio
        working-directory: teacher-tools-preview
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
          npm test
          mkdir -p ../build/web/teaching-studio
          cp -a dist/. ../build/web/teaching-studio/
      - name: Verify complete package and record source provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('build/web')
          for path in ['index.html', 'main.dart.js', 'teaching-studio/index.html', 'teaching-studio/pdfjs/build/pdf.worker.mjs']:
              assert (root / path).is_file(), path
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          manifest = {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
              'run': os.environ['GITHUB_RUN_ID'],
              'nativeGradebookBlob': git('rev-parse', 'HEAD:lib/screens/native_gradebook_screen.dart'),
              'files': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in sorted(root.rglob('*')) if p.is_file()
                        and not any(part.startswith('.') for part in p.relative_to(root).parts)}}
          (root / 'review-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Verified complete Flutter + Studio package for', manifest['commit'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-gradebook-review-app
          path: build/web/
          retention-days: 14
  native-browser:
    name: Native Gradebook on fictional Firebase emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix staging-tests --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build guarded emulator-only app
        run: |
          flutter build web --debug --no-wasm-dry-run --target lib/main.dart --base-href / \
            --dart-define=GRADEFLOW_PLANNER_V2_STAGING=true \
            --dart-define=GRADEFLOW_V2_LOCAL_EMULATORS=true \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_PROJECT_ID=demo-gradeflow-v2-staging \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_API_KEY=emulator-only-not-a-real-api-key \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_APP_ID=1:1234567890:web:local-emulator \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_SENDER_ID=1234567890 \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_AUTH_DOMAIN=demo-gradeflow-v2-staging.firebaseapp.com \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_STORAGE_BUCKET=demo-gradeflow-v2-staging.firebasestorage.app
      - name: Verify native score, policy and downloaded Excel flow
        env:
          PLAYWRIGHT_DISABLE_FORCED_CHROMIUM_PROXIED_LOOPBACK: '1'
        run: |
          ./staging-tests/node_modules/.bin/firebase emulators:exec \
            --project demo-gradeflow-v2-staging --config firebase.native-gradebook-test.json \
            --only auth,firestore \
            "node staging-tests/seed-native-gradebook.mjs && node node_modules/@playwright/test/cli.js test --config=playwright.native-gradebook.config.ts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gradebook-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

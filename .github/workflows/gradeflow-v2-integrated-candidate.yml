name: GradeFlow V2 integrated candidate checks
on:
  push:
    branches: [integration/gradeflow-v2-release-candidate-20261115]
permissions:
  contents: read
concurrency:
  group: gradeflow-v2-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Preview authentication checks
        run: flutter test --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW=true test/auth_fallback_safety_test.dart test/login_screen_test.dart
      - name: Live V2 authentication checks
        run: flutter test --dart-define=GRADEFLOW_LIVE_CLASSROOM_V2=true test/auth_fallback_safety_test.dart test/login_screen_test.dart test/gradeflow_existing_project_preview_test.dart
      - name: Build actual authenticated application
        run: flutter build web --release --no-wasm-dry-run --target lib/main.dart --base-href / --dart-define=GRADEFLOW_LIVE_CLASSROOM_V2=true
      - uses: actions/upload-artifact@v4
        with:
          name: gradeflow-v2-integrated-app
          path: build/web/
          retention-days: 14
  browser:
    needs: validate
    # Playwright 1.57 is not compatible with Ubuntu 26.04 on latest runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test test/planner_v2_emulator_safety_test.dart test/planner_v2_staging_safety_test.dart
      - name: Build local-only debug app for Firebase emulators
        # FlutterFire 6.3.1 deliberately persists/reuses emulator origins
        # only when kDebugMode is true. A release build must NEVER rely on
        # Firebase's debug-only emulator reconnection behaviour.
        run: |
          flutter build web --debug --no-wasm-dry-run --target lib/main.dart \
            --base-href / \
            --dart-define=GRADEFLOW_PLANNER_V2_STAGING=true \
            --dart-define=GRADEFLOW_V2_LOCAL_EMULATORS=true \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_PROJECT_ID=demo-gradeflow-v2-staging \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_API_KEY=emulator-only-not-a-real-api-key \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_APP_ID=1:1234567890:web:local-emulator \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_SENDER_ID=1234567890 \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_AUTH_DOMAIN=demo-gradeflow-v2-staging.firebaseapp.com \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_STORAGE_BUCKET=demo-gradeflow-v2-staging.firebasestorage.app
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix staging-tests --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Local real-auth browser + Firebase data tests
        run: |
          ./staging-tests/node_modules/.bin/firebase emulators:exec \
            --project demo-gradeflow-v2-staging \
            --config firebase.staging.json \
            --only auth,firestore \
            "node staging-tests/seed-browser-fixtures.mjs && npx playwright test --config=playwright.staging.config.ts"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-emulator-browser-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
  

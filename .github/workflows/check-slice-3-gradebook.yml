name: Slice 3 gradebook checks
on:
  push:
    branches: [classroom-experience-v2/release-1-slice-3]
permissions:
  contents: read
concurrency:
  group: slice-3-gradebook
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub lib/gradebook_period_preview.dart lib/screens/period_gradebook_workspace.dart lib/services/grading_period_ui_controller.dart lib/repositories/period_gradebook_adapter.dart
      - run: flutter test --no-pub test/grading_period_test.dart --reporter expanded

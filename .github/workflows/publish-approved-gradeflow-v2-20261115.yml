name: Publish Stuart-approved GradeFlow V2
# One authorised release of the already verified package. No application rebuild.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-approved-gradeflow-v2-20261115.yml']
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: gradeflow-existing-firebase-hosting-live
  cancel-in-progress: false
jobs:
  publish:
    name: Back up and publish the verified existing-site update
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86225d680300314f7ac3b3abdbb70f28d8600bc8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 43715124796 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 43715124796 --json headSha --jq .headSha)" = 86225d680300314f7ac3b3abdbb70f28d8600bc8
          test "$(gh run view 43714479112 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 43714479112 --json headSha --jq .headSha)" = 241c5deb3107259374bdc0c51fe95599693b37f8
          test "$(gh run view 43712835336 --json conclusion --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: GradeFlow-V2-Ready-To-Install
          path: candidate
          github-token: ${{ github.token }}
          run-id: 43715124796
      - name: Verify Hosting-only package and release marker
        run: |
          set -euo pipefail
          test -s candidate/build/web/main.dart.js
          test -s candidate/build/web/index.html
          grep -q 'b2a6dcd8c55231a2276e9819083c59a176b276d2' candidate/release-gradeflow-live-v2.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('candidate/firebase.live.json'));
          if (!c.hosting || c.hosting.public !== 'build/web') throw Error('Unexpected Hosting output');
          if (!c.hosting.rewrites?.some(r => r.source === '**' && r.destination === '/index.html')) throw Error('Missing app routing');
          for (const key of ['firestore','functions','storage','database','remoteconfig','extensions']) {
            if (c[key]) throw Error('Hosting-only release required');
          }
          NODE
      - name: Validate existing-project identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GRADEFLOW_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GRADEFLOW_WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER"
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]
          [[ "$WIF_SERVICE_ACCOUNT" =~ ^[^@]+@gradeflow-20260113\.iam\.gserviceaccount\.com$ ]]
      - name: Authenticate through existing short-lived production identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GRADEFLOW_WIF_PROVIDER }}
          service_account: ${{ vars.GRADEFLOW_WIF_SERVICE_ACCOUNT }}
          project_id: gradeflow-20260113
          create_credentials_file: true
          export_environment_variables: true
      - run: npm install --global firebase-tools
      - name: Back up LIVE before publishing Hosting only
        working-directory: candidate
        run: |
          set -euo pipefail
          backup="before-v2-${GITHUB_RUN_ID}"
          firebase hosting:clone gradeflow-20260113:live "gradeflow-20260113:$backup" --project gradeflow-20260113 --non-interactive
          echo "$backup" > backup-channel.txt
          echo "Rollback channel: $backup" >> "$GITHUB_STEP_SUMMARY"
          firebase deploy --only hosting --project gradeflow-20260113 --config firebase.live.json --non-interactive
      - name: Verify published application bytes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --compressed "https://gradeflow-20260113.web.app/main.dart.js?release=${GITHUB_RUN_ID}" -o published-main.dart.js
          cmp candidate/build/web/main.dart.js published-main.dart.js
          curl --fail --silent --show-error --retry 3 --compressed "https://gradeflow-20260113.web.app/os/home?release=${GITHUB_RUN_ID}" -o published-home.html
          cmp candidate/build/web/index.html published-home.html
          echo 'Published and byte-verified: https://gradeflow-20260113.web.app/os/home' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradeflow-v2-release-receipt
          path: candidate/backup-channel.txt
          if-no-files-found: ignore
          retention-days: 30

name: Classroom full-app browser acceptance
on:
  pull_request:
    branches: [integration/instructos-classroom-experience-20261128]
permissions:
  contents: read
concurrency:
  group: classroom-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/planner_v2_emulator_safety_test.dart test/planner_v2_staging_safety_test.dart
      - name: Compile exact full application for fictional localhost emulator data only
        run: |
          flutter build web --debug --no-wasm-dry-run --target lib/main.dart \
            --base-href / \
            --dart-define=GRADEFLOW_PLANNER_V2_STAGING=true \
            --dart-define=GRADEFLOW_V2_LOCAL_EMULATORS=true \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_PROJECT_ID=demo-gradeflow-v2-staging \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_API_KEY=emulator-only-not-a-real-api-key \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_APP_ID=1:1234567890:web:local-emulator \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_SENDER_ID=1234567890 \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_AUTH_DOMAIN=demo-gradeflow-v2-staging.firebaseapp.com \
            --dart-define=GRADEFLOW_STAGING_FIREBASE_STORAGE_BUCKET=demo-gradeflow-v2-staging.firebasestorage.app
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix staging-tests --no-audit --no-fund
      - run: npm --prefix teacher-tools-preview ci --ignore-scripts --no-audit --no-fund
      - run: |
          npm --prefix teacher-tools-preview run build
          mkdir -p build/web/teaching-studio
          cp -a teacher-tools-preview/dist/. build/web/teaching-studio/
      - run: npx playwright install --with-deps chromium
      - name: Exercise real Home, Classroom, timer, screensaver, Planner, Gradebook and Studio
        env:
          PLAYWRIGHT_DISABLE_FORCED_CHROMIUM_PROXIED_LOOPBACK: '1'
        run: |
          ./staging-tests/node_modules/.bin/firebase emulators:exec \
            --project demo-gradeflow-v2-staging --config firebase.staging.json --only auth,firestore \
            "node staging-tests/seed-browser-fixtures.mjs && npx playwright test --config=playwright.staging.config.ts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-full-app-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

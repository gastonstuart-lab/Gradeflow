name: Package verified GradeFlow V2 for existing live site
on:
  push:
    branches: [integration/gradeflow-v2-release-candidate-20261115]
    paths: ['.github/workflows/package-gradeflow-v2-live.yml']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the corrected actual-browser acceptance run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 43714479112 --exit-status
          test "$(gh run view 43714479112 --json headSha --jq .headSha)" = "241c5deb3107259374bdc0c51fe95599693b37f8"
          test "$(gh run view 43712835336 --json conclusion --jq .conclusion)" = "success"
          git diff --exit-code b2a6dcd8c55231a2276e9819083c59a176b276d2 HEAD -- lib assets web pubspec.yaml pubspec.lock
      - name: Reuse the already validated release build
        uses: actions/download-artifact@v4
        with:
          name: gradeflow-v2-integrated-app
          path: package/build/web
          github-token: ${{ github.token }}
          run-id: 43712835336
      - name: Assemble rollback-first Windows package
        run: |
          cp firebase.live.json package/firebase.live.json
          cp scripts/deploy-gradeflow-live.cmd package/deploy-gradeflow-live.cmd
          cp scripts/rollback-gradeflow-live.cmd package/rollback-gradeflow-live.cmd
          printf '%s\n' 'GradeFlow V2 approved Planner release candidate' 'Build source: b2a6dcd8c55231a2276e9819083c59a176b276d2' 'Browser acceptance: 241c5deb3107259374bdc0c51fe95599693b37f8' 'Existing project: gradeflow-20260113' 'GRADEFLOW_LIVE_CLASSROOM_V2=true' > package/release-gradeflow-live-v2.txt
          test -s package/build/web/index.html
          test -s package/build/web/main.dart.js
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('package/firebase.live.json'));
          if (!c.hosting || c.hosting.public !== 'build/web') throw Error('Unexpected Hosting output');
          for (const key of ['firestore','functions','storage','database','remoteconfig','extensions']) {
            if (c[key]) throw Error('Hosting-only package required');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: GradeFlow-V2-Ready-To-Install
          path: package/
          retention-days: 14

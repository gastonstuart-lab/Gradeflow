name: Publish Stuart-approved GradeFlow reliability release
# One authorised release of the already verified package. No application rebuild.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-approved-teaching-studio-20261115.yml']
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: gradeflow-existing-firebase-hosting-live
  cancel-in-progress: false
jobs:
  publish:
    name: Back up and publish the verified existing-site update
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4dcfe0e7f56f9bc083f868f3237cfc64be4852c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact app and browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44026447494 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44026447494 --json headSha --jq .headSha)" = b4dcfe0e7f56f9bc083f868f3237cfc64be4852c
          test "$(gh run view 44026447506 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44026447506 --json headSha --jq .headSha)" = b4dcfe0e7f56f9bc083f868f3237cfc64be4852c
          test "$(gh run view 44026447526 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 44026447526 --json headSha --jq .headSha)" = b4dcfe0e7f56f9bc083f868f3237cfc64be4852c
          # Verify that the reviewed release package exactly matches the merged
          # integration-branch source tree, not merely a detached feature branch.
          test "$(gh api repos/gastonstuart-lab/Gradeflow/git/commits/1dfc2899e26cd1445e2db45a80529854c2861660 --jq .tree.sha)" = 6a7d1ce8fbff1ee2902fe1741feb1100de8129c6
          test "$(git rev-parse HEAD^{tree})" = 6a7d1ce8fbff1ee2902fe1741feb1100de8129c6
          test "$(gh api repos/gastonstuart-lab/Gradeflow/actions/artifacts/14303306855 --jq .digest)" = sha256:c95d9014681e58cf39a8a335ef26990eb9e0dce299f4d00b2153df514f4ce841
      - uses: actions/download-artifact@v4
        with:
          name: native-gradebook-review-app
          path: candidate/build/web
          github-token: ${{ github.token }}
          run-id: 44026447494
      - name: Verify Hosting-only application and Studio
        run: |
          set -euo pipefail
          cp firebase.live.json candidate/firebase.live.json
          test -s candidate/build/web/main.dart.js
          test -s candidate/build/web/teaching-studio/index.html
          test -s candidate/build/web/teaching-studio/pdfjs/build/pdf.worker.mjs
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('candidate/build/web')
          manifest = json.loads((root / 'review-manifest.json').read_text())
          assert manifest['commit'] == 'b4dcfe0e7f56f9bc083f868f3237cfc64be4852c'
          assert manifest['tree'] == '6a7d1ce8fbff1ee2902fe1741feb1100de8129c6'
          actual = {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()
                    and p.name != 'review-manifest.json'
                    and not any(part.startswith('.') for part in p.relative_to(root).parts)}
          assert actual == set(manifest['files']), 'Package file inventory mismatch'
          for path, expected in manifest['files'].items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == expected, path
          print('Verified source manifest and all', len(actual), 'application files')
          PY
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('candidate/firebase.live.json'));
          if (!c.hosting || c.hosting.public !== 'build/web') throw Error('Unexpected Hosting output');
          if (!c.hosting.rewrites?.some(r => r.source === '**' && r.destination === '/index.html')) throw Error('Missing app routing');
          for (const key of ['firestore','functions','storage','database','remoteconfig','extensions']) {
            if (c[key]) throw Error('Hosting-only release required');
          }
          NODE
      - name: Load reviewed byte-verification helper from release-control commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/verify-hosting-release.sh?ref=${GITHUB_SHA}" \
            -H 'Accept: application/vnd.github.raw+json' > verify-hosting-release.sh
          bash -n verify-hosting-release.sh
      - name: Validate existing-project identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GRADEFLOW_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GRADEFLOW_WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER"
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]
          [[ "$WIF_SERVICE_ACCOUNT" =~ ^[^@]+@gradeflow-20260113\.iam\.gserviceaccount\.com$ ]]
      - name: Authenticate through existing short-lived production identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GRADEFLOW_WIF_PROVIDER }}
          service_account: ${{ vars.GRADEFLOW_WIF_SERVICE_ACCOUNT }}
          project_id: gradeflow-20260113
          create_credentials_file: true
          export_environment_variables: true
      - run: npm install --global firebase-tools
      - name: Back up LIVE before publishing Hosting only
        working-directory: candidate
        run: |
          set -euo pipefail
          backup="before-reliability-${GITHUB_RUN_ID}"
          firebase hosting:clone gradeflow-20260113:live "gradeflow-20260113:$backup" --project gradeflow-20260113 --non-interactive
          echo "$backup" > backup-channel.txt
          echo "Rollback channel: $backup" >> "$GITHUB_STEP_SUMMARY"
          firebase deploy --only hosting --project gradeflow-20260113 --config firebase.live.json --non-interactive
      - name: Verify published application bytes with bounded propagation retries
        run: |
          bash verify-hosting-release.sh candidate/build/web https://gradeflow-20260113.web.app "$GITHUB_RUN_ID"
          echo 'Published and byte-verified: https://gradeflow-20260113.web.app/os/home' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradeflow-v2-release-receipt
          path: candidate/backup-channel.txt
          if-no-files-found: ignore
          retention-days: 30

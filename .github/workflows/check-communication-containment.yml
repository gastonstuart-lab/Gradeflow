name: Check communication containment
on:
  push:
    branches: [security/communication-containment-20261116]
  pull_request:
    branches: [main]
    paths: ['firestore.rules','firebase.communication-containment.json','scripts/test-communication-containment.cjs','.github/workflows/check-communication-containment.yml']
permissions:
  contents: read
concurrency:
  group: containment-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 97604434b9f4cadd5a878166fecb3a628ab7f853
          path: .test-tools
          sparse-checkout: staging-tests
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix .test-tools/staging-tests --ignore-scripts --no-audit --no-fund
      - name: Check containment and preserved academic ownership on fictional emulator
        env:
          GRADEFLOW_TEST_DEPENDENCIES: ${{ github.workspace }}/.test-tools/staging-tests
        run: |
          ./.test-tools/staging-tests/node_modules/.bin/firebase emulators:exec \
            --project demo-gradeflow-communication-containment \
            --config firebase.communication-containment.json --only firestore \
            "node scripts/test-communication-containment.cjs"

name: Isolated timetable account sync
on:
  pull_request:
    branches: [integration/instructos-classroom-experience-20261128]
    paths: ['lib/services/teacher_timetable_sync.dart','lib/repositories/firestore_timetable_sync_repository.dart','test/firestore_timetable_sync_emulator_test.dart','firebase.timetable-sync-test.json','staging-tests/timetable-sync.rules','.github/workflows/timetable-sync-emulator.yml']
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/services/teacher_timetable_sync.dart lib/repositories/firestore_timetable_sync_repository.dart test/firestore_timetable_sync_emulator_test.dart
      - run: npm install --prefix staging-tests --ignore-scripts --no-audit --no-fund
      - run: ./staging-tests/node_modules/.bin/firebase emulators:exec --project demo-gradeflow-timetable-sync --config firebase.timetable-sync-test.json --only firestore,auth "flutter test --platform chrome --reporter expanded test/firestore_timetable_sync_emulator_test.dart"

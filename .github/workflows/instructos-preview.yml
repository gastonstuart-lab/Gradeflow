name: InstructOS Integration Preview

# This workflow ALREADY EXISTS on the default branch, so GitHub exposes
# "Run workflow". Select the reviewed V2 integration branch manually.
# Never publish automatically, and never run on main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradeflow-approved-classroom-v2-firebase-preview
  cancel-in-progress: false

jobs:
  build-and-deploy-classroom-v2-preview:
    if: github.ref == 'refs/heads/integration/v2-flutterfire-auth-refresh-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout reviewed GradeFlow V2 branch
        uses: actions/checkout@v4

      - name: Verify target branch and Hosting-only configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/v2-flutterfire-auth-refresh-20261109"
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('firebase.preview.json', 'utf8'));
          if (!c.hosting || c.firestore || c.functions || c.storage || c.database || c.remoteconfig) {
            throw new Error('Preview manifest must contain Hosting only');
          }
          if (c.hosting.public !== 'build/web' ||
              !c.hosting.rewrites?.some(r => r.source === '**' && r.destination === '/index.html')) {
            throw new Error('Preview manifest is not the approved Flutter SPA configuration');
          }
          NODE

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Use locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze release candidate
        run: flutter analyze

      - name: Verify preview host/production isolation tests
        run: |
          flutter test test/gradeflow_existing_project_preview_test.dart \
            test/planner_v2_staging_safety_test.dart \
            test/planner_v2_firebase_config_test.dart

      - name: Build authenticated V2 with production-host fail-closed guard
        run: |
          flutter build web --release --no-wasm-dry-run --target lib/main.dart \
            --base-href / \
            --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW=true

      - name: Replace local CLI manifest with Hosting-only preview manifest
        # GitHub Action uses the root firebase.json. This temporary overwrite
        # does not edit repository files, live Hosting, Firestore rules or functions.
        shell: bash
        run: |
          set -euo pipefail
          cp firebase.preview.json firebase.json
          node - <<'NODE'
          const c = JSON.parse(require('node:fs').readFileSync('firebase.json'));
          if (!c.hosting || c.firestore || c.functions || c.storage || c.database) process.exit(1);
          NODE

      - name: Deploy ONLY to existing-project Classroom V2 preview channel
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: gradeflow-20260113
          channelId: classroom-v2
          expires: 7d

      - name: Display temporary preview URL for owner review
        shell: bash
        env:
          GRADEFLOW_PREVIEW_URL: '${{ steps.firebase_preview.outputs.details_url }}'
        run: |
          echo "GradeFlow approved Classroom V2 preview: $GRADEFLOW_PREVIEW_URL"
          echo "This is not the GradeFlow live Hosting channel."
          echo "For Firebase Google sign-in, authorize this exact preview hostname under Authentication > Settings > Authorized domains if needed."

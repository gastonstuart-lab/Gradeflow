name: Communication security prototype
on:
  push:
    branches: [security/communication-access-20261116]
  pull_request:
    branches: [integration/gradeflow-v2-release-candidate-20261115]
    paths: ['firestore.rules','firebase.communication-test.json','lib/**','test/**','staging-tests/**','.github/workflows/communication-security.yml']
permissions:
  contents: read
concurrency:
  group: communication-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: npm install --prefix staging-tests --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Compile loopback-only fictional SDK acceptance app
        run: flutter build web --debug --no-wasm-dry-run --target integration/communication_security_main.dart --dart-define=GRADEFLOW_COMMUNICATION_SECURITY_ACCEPTANCE=true
      - name: Red-team rules and real Flutter repository on fictional emulators
        run: |
          ./staging-tests/node_modules/.bin/firebase emulators:exec \
            --project demo-gradeflow-communication-security \
            --config firebase.communication-test.json --only auth,firestore \
            "node staging-tests/communication-rules.test.mjs && node staging-tests/communication-web-fixtures.mjs && node staging-tests/communication-repository-browser.mjs"
      - name: Compile actual live application; never deploy
        run: flutter build web --release --no-wasm-dry-run --dart-define=GRADEFLOW_LIVE_CLASSROOM_V2=true
      - name: Preserve already-tested Studio without changing its source
        run: |
          git diff --exit-code 31a1a3ec6f22275872c0fa8073b8da446614a2e8 HEAD -- teacher-tools-preview
          cd teacher-tools-preview
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p ../build/web/teaching-studio
          cp -a dist/. ../build/web/teaching-studio/
      - uses: actions/upload-artifact@v4
        with:
          name: communication-security-review-app
          path: build/web/
          retention-days: 14

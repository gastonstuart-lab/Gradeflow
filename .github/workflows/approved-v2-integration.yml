name: Approved V2 integrated staging candidate
on:
  push:
    branches:
      - integration/approved-v2-auth-staging-candidate-20261109
  pull_request:
    branches:
      - integration/home-selected-class-context-20261109
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Home, Classroom, staging and geometry regression tests
        run: flutter test test/home_teaching_class_context_test.dart test/approved_teacher_home_bindings_test.dart test/os_controller_test.dart test/classroom_surface_test.dart test/planner_v2_camera_fit_test.dart test/planner_v2_gesture_widget_test.dart test/planner_v2_staging_safety_test.dart test/planner_v2_firebase_config_test.dart
      - run: flutter test
      - name: Synthetic approved Classroom web build
        run: flutter build web --release --no-wasm-dry-run --target lib/main_classroom_preview.dart --base-href /
      - name: Authenticated production-default build, V2 disabled
        run: flutter build web --release --no-wasm-dry-run --target lib/main.dart --base-href /
      - name: Authenticated staging build, fails closed without staging config
        run: flutter build web --release --no-wasm-dry-run --target lib/main.dart --base-href / --dart-define=GRADEFLOW_PLANNER_V2_STAGING=true
  firestore-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix staging-tests --no-audit --no-fund
      - name: Verify no cross-teacher Firestore access
        run: ./staging-tests/node_modules/.bin/firebase emulators:exec --project demo-gradeflow-v2-staging --config firebase.staging.json --only firestore "node staging-tests/rules.test.mjs"

name: Review GradeFlow login backdrop contrast

on:
  push:
    branches:
      - feat/login-readable-backdrop-20261111

permissions:
  contents: read

concurrency:
  group: review-login-contrast
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-wasm-dry-run --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW=true --dart-define=GRADEFLOW_EXISTING_PROJECT_PREVIEW_CHANNEL=login-boxes

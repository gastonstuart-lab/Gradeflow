<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Professional workflow operating system for teachers.">
  <meta name="theme-color" content="#050912">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="InstructOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In (optional but recommended for Flutter web) -->
  <!-- Set this to your OAuth Web client ID from Google Cloud Console -->
  <meta name="google-signin-client_id" content="851087972500-06hut292tqfb86o9jmfo55tc441de78.apps.googleusercontent.com">

  <title>InstructOS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      --gf-bg: #050912;
      --gf-bg-soft: #090b16;
      --gf-text: #f5f7fb;
      --gf-muted: rgba(245, 247, 251, 0.72);
      --gf-accent: #8b5cf6;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 24% 38%, rgba(255, 62, 165, 0.16), transparent 32%),
        radial-gradient(circle at 72% 52%, rgba(34, 211, 238, 0.13), transparent 34%),
        radial-gradient(circle at 50% 88%, rgba(139, 92, 246, 0.14), transparent 38%),
        linear-gradient(140deg, #050711 0%, #0a1023 56%, var(--gf-bg-soft) 100%);
      color: var(--gf-text);
    }

    body {
      overflow: hidden;
      font-family: "Segoe UI", "SF Pro Display", system-ui, sans-serif;
    }

    body.gradeflow-ready {
      overflow: auto;
    }

    /* Browser bootstrap only: show the same understated box grid as Flutter.
       The Flutter launch gate owns branding, so users do not see the same
       InstructOS title and tagline on two consecutive loading screens. */
    #gradeflow-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: #07101d;
      background-image:
        radial-gradient(circle at 53% 42%, rgba(57, 213, 190, 0.085), transparent 25%),
        linear-gradient(rgba(187, 211, 231, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(187, 211, 231, 0.07) 1px, transparent 1px),
        linear-gradient(135deg, #07101d, #0c162a 56%, #070f1d);
      background-size: auto, 54px 54px, 54px 54px, auto;
      opacity: 1;
      visibility: visible;
      transition: opacity 280ms ease, visibility 280ms ease;
      z-index: 9999;
    }

    #gradeflow-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gf-loader-shell {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(94, 234, 212, 0.18);
      border-radius: 10px;
      background: rgba(18, 42, 58, 0.52);
      box-shadow: 0 0 36px rgba(57, 213, 190, 0.055);
    }

    .gf-loader-dot {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #a5f3e9;
      box-shadow: 0 0 14px rgba(94, 234, 212, 0.3);
      animation: instructos-pulse 1.5s ease-in-out infinite alternate;
    }

    @media (prefers-reduced-motion: reduce) {
      .gf-loader-dot { animation: none; }
      #gradeflow-loader { transition: none; }
    }

    @keyframes instructos-pulse {
      from { opacity: 0.36; transform: scale(0.85); }
      to { opacity: 0.86; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="gradeflow-loader" aria-hidden="true">
    <div class="gf-loader-shell"><span class="gf-loader-dot"></span></div>
  </div>
  <script>
    (function () {
      const loader = document.getElementById('gradeflow-loader');
      let removed = false;

      function removeLoader() {
        if (!loader || removed) {
          return;
        }
        removed = true;
        document.body.classList.add('gradeflow-ready');
        loader.classList.add('is-hidden');
        window.setTimeout(() => loader.remove(), 420);
      }

      window.addEventListener('flutter-first-frame', removeLoader);
      window.addEventListener('load', () => {
        window.setTimeout(() => {
          if (!removed) {
            loader?.classList.remove('is-hidden');
          }
        }, 0);
      });

      const flutterViewCheck = window.setInterval(() => {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          window.clearInterval(flutterViewCheck);
          removeLoader();
        }
      }, 500);

    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

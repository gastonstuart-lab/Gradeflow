<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Professional workflow operating system for teachers.">
  <meta name="theme-color" content="#f0f5fa">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InstructOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/instructos-mark.svg"/>

  <!-- Google Sign-In (optional but recommended for Flutter web) -->
  <!-- Set this to your OAuth Web client ID from Google Cloud Console -->
  <meta name="google-signin-client_id" content="851087972500-06hut292tqfb86o9jmfo55tc441de78.apps.googleusercontent.com">

  <title>InstructOS</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Match the saved appearance before Flutter draws its first frame.
    try {
      const saved = JSON.parse(localStorage.getItem('flutter.theme_mode_v1') || '"light"');
      if (saved === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#07131f';
      }
    } catch (_) {}
  </script>
  <style>
    :root {color-scheme:light;--canvas:#f0f5fa;--ink:#173b63;--muted:#586f82;--teal:#187f79;--wash:#eaf5f2;}
    :root[data-theme="dark"] {color-scheme:dark;--canvas:#07131f;--ink:#e8f2f7;--muted:#a8bdcb;--teal:#82d5cc;--wash:#102c32;}
    html,body{width:100%;height:100%;margin:0;background:var(--canvas);color:var(--ink);}
    body{overflow:hidden;font-family:Roboto,"Segoe UI",system-ui,sans-serif;}
    body.gradeflow-ready{overflow:auto;}
    #gradeflow-loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,var(--canvas),var(--wash));z-index:9999;transition:opacity 240ms ease,visibility 240ms ease;}
    #gradeflow-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none;}
    .gf-loader-shell{width:min(100%,430px);text-align:center;}
    .gf-loader-mark{display:block;width:64px;height:64px;margin:0 auto 24px;}
    .gf-loader-title{margin:0;font-size:2rem;font-weight:800;letter-spacing:-1px;line-height:1.15;}
    .gf-loader-copy{margin:8px 0 0;color:var(--muted);font-size:1rem;line-height:1.5;}
    .gf-loader-status{margin:14px 0 0;color:var(--muted);font-size:.8rem;}
    .gf-loader-dot{height:7px;width:7px;margin:32px auto 0;border-radius:50%;background:var(--teal);animation:instructos-pulse 1.5s ease-in-out infinite alternate;}
    .gf-loader-retry{margin-top:16px;padding:12px 20px;border:0;border-radius:14px;background:#187f79;color:white;font:inherit;cursor:pointer;}
    .gf-loader-retry:focus-visible{outline:3px solid var(--teal);outline-offset:4px;}
    @keyframes instructos-pulse{from{opacity:.36}to{opacity:.88}}
    @media(prefers-reduced-motion:reduce){.gf-loader-dot{animation:none}#gradeflow-loader{transition:none}}
  </style>
</head>
<body>
  <div id="gradeflow-loader" role="status" aria-live="polite">
    <div class="gf-loader-shell">
      <img class="gf-loader-mark" src="icons/instructos-mark.svg" alt="">
      <h1 class="gf-loader-title">InstructOS</h1>
      <p class="gf-loader-copy">Teaching, organised.</p>
      <div class="gf-loader-dot" aria-hidden="true"></div>
      <p class="gf-loader-status">Opening your workspace</p>
      <p id="loader-help" class="gf-loader-status" hidden>Taking longer than usual. Check your connection and try again.</p>
      <button id="loader-retry" class="gf-loader-retry" hidden>Try again</button>
    </div>
  </div>
  <script>
    (function () {
      const loader = document.getElementById('gradeflow-loader');
      let removed = false;
      document.getElementById('loader-retry').addEventListener('click', () => window.location.reload());
      window.setTimeout(() => { if (!removed) { document.getElementById('loader-help').hidden = false; document.getElementById('loader-retry').hidden = false; } }, 15000);

      function removeLoader() {
        if (!loader || removed) {
          return;
        }
        removed = true;
        document.body.classList.add('gradeflow-ready');
        loader.classList.add('is-hidden');
        window.setTimeout(() => loader.remove(), 420);
      }

      window.addEventListener('flutter-first-frame', removeLoader);
      window.addEventListener('load', () => {
        window.setTimeout(() => {
          if (!removed) {
            loader?.classList.remove('is-hidden');
          }
        }, 0);
      });

      const flutterViewCheck = window.setInterval(() => {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          window.clearInterval(flutterViewCheck);
          removeLoader();
        }
      }, 500);

    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
